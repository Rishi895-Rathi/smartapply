services:
  postgres:
    image: postgres:17
    container_name: smartapply-db
    environment:
      POSTGRES_DB: smartapply
      POSTGRES_USER: ${DB_USERNAME:-smartapply}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-smartapply_dev}
    ports:
      - "5432:5432"
    volumes:
      - smartapply-pgdata:/var/lib/postgresql/data

volumes:
  smartapply-pgdata: